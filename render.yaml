# Render Blueprint for the free-tier hosted deployment of the backend.
#
# The api service runs backend/src/hostedServer.ts, which starts BOTH the Express API and
# the BullMQ worker in one process — Render's free tier doesn't offer a background-worker
# service type (workers require a paid plan), so this trades the local/Docker setup's
# separate api+worker processes for a single free one on hosting only. See
# backend/src/hostedServer.ts and the README's Architecture section for the local setup,
# which keeps them separate.
#
# Secrets (marked `sync: false` below) are NOT stored in this file — after the Blueprint is
# applied, set their real values in the Render dashboard (Environment tab). Copy them from
# your local backend/.env.
services:
  - name: reachinbox-scheduler-api
    type: web
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # A quoted `sh -c "..."` string isn't reliably shell-parsed by Render's dockerCommand
    # (quoting gets mangled, causing "exit 127: command not found") — a real script file
    # avoids that entirely. See backend/docker-entrypoint-hosted.sh.
    dockerCommand: ./docker-entrypoint-hosted.sh
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      # Render appended a suffix to the service name above because the plain name was
      # already taken — this is the actual assigned URL, confirmed live. If you fork this
      # repo and re-apply the Blueprint under a different account, Render will likely
      # assign yet another URL; update these two (and the Google Cloud Console redirect
      # URI) to match whatever it actually assigns.
      - key: BACKEND_URL
        value: https://reachinbox-scheduler-api-r9pt.onrender.com
      - key: GOOGLE_CALLBACK_URL
        value: https://reachinbox-scheduler-api-r9pt.onrender.com/api/auth/google/callback
      # Set this to your real Vercel URL once known (Vercel dashboard -> Deployments).
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: reachinbox-scheduler-db
          property: connectionString
      # Upstash rediss:// connection string (create a free Redis DB at upstash.com first).
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Real Gmail SMTP delivery — see README "Real delivery via Gmail SMTP". NOT used on
      # Render: raw SMTP (any provider, any port) is network-blocked on Render's free tier
      # since Sept 2025, so RESEND_API_KEY below takes priority instead. Left here only so
      # this same render.yaml still works unmodified on a paid Render plan, which doesn't
      # have the SMTP block.
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      # HTTP-API email delivery via Resend (resend.com) — works on Render's free tier
      # because it's plain HTTPS, not SMTP. Takes priority over Gmail/Ethereal when set.
      # RESEND_FROM_EMAIL: use "onboarding@resend.dev" for testing (only delivers to the
      # address you signed up to Resend with) or an address on a domain you've verified.
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: ETHEREAL_AUTO_CREATE
        value: "false"

databases:
  - name: reachinbox-scheduler-db
    plan: free
